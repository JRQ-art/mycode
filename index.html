<!DOCTYPE html>
<!--
  ============================================
  个人名片网页（简约风格）
  - 布局：居中卡片式
  - 使用 HTML5 语义结构与外部独立 CSS 文件
  - 中文注释说明每个模块的作用
  ============================================
-->
<html lang="zh-CN">
<head>
    <!-- 字符编码：保证中文正常显示 -->
    <meta charset="UTF-8">

    <!-- 视口设置：移动设备上正常缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 页面标题 -->
    <title>个人名片 · 张伟</title>

    <!-- 引入独立样式文件（HTML 结构与 CSS 样式分离书写） -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ======== 名片卡片：整体为一张居中卡片 ======== -->
    <div class="card">

        <!-- 头像区域：圆形头像 + 装饰光环 -->
        <div class="avatar-box">
            <!-- 头像图片：由 CSS 裁剪为圆形 -->
            <img src="avatar.svg" alt="头像" class="avatar">
        </div>

        <!-- 姓名 -->
        <h1 class="name">张伟</h1>

        <!-- 职位 -->
        <p class="role">前端开发工程师</p>

        <!-- 分隔线：将个人信息与联系方式分开 -->
        <hr class="divider">

        <!-- 联系方式列表 -->
        <ul class="contact-list">
            <li class="contact-item">
                <span class="icon">📞</span> <!-- 电话图标 -->
                <span class="text">+86 138-0000-0000</span>
            </li>
            <li class="contact-item">
                <span class="icon">✉️</span> <!-- 邮箱图标 -->
                <span class="text">zhangwei@example.com</span>
            </li>
            <li class="contact-item">
                <span class="icon">📍</span> <!-- 地址图标 -->
                <span class="text">北京市海淀区</span>
            </li>
        </ul>

    </div>

</body>
</html>
